name: Cabinet NAS 2026.09.12
on:
  push:
    paths: ['versions/cabinet-2026.09.12/**', '.github/workflows/cabinet-2026-09-12.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metier-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: test-local-ci-seulement
          POSTGRES_DB: cabinet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: versions/cabinet-2026.09.12/Serveur
      CABINET_TEST_DATABASE_URL: postgresql://postgres:test-local-ci-seulement@localhost:5432/cabinet_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r versions/cabinet-2026.09.12/Serveur/requirements.txt
      - run: python -m pytest -q versions/cabinet-2026.09.12/Serveur/tests
      - run: python versions/cabinet-2026.09.12/Tests/audit_statique.py
      - run: python versions/cabinet-2026.09.12/Tests/test_sqlite.py
      - name: Construction OOXML et preparation
        shell: pwsh
        run: |
          ./versions/cabinet-2026.09.12/Tests/test_construction.ps1
          ./versions/cabinet-2026.09.12/Tests/test_installation.ps1
