name: Cabinet NAS 2026.09.12
on:
  pull_request:
    paths: ['Installateur/**', 'cabinet-unifie/**', 'versions/cabinet-2026.09.12/**', '.github/workflows/cabinet-2026-09-12.yml']
  push:
    paths: ['Installateur/**', 'versions/cabinet-2026.09.12/**', '.github/workflows/cabinet-2026-09-12.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restauration-u0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Sauvegarde et restauration native dans un projet isole
        run: sh versions/cabinet-2026.09.12/Tests/test_recovery_docker.sh
  image-permissions-nas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Image construite depuis des sources restrictives, execution sans root
        run: bash versions/cabinet-2026.09.12/Tests/test_image_permissions.sh

  metier-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: test-local-ci-seulement
          POSTGRES_DB: cabinet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: versions/cabinet-2026.09.12/Serveur
      CABINET_TEST_DATABASE_URL: postgresql://postgres:test-local-ci-seulement@localhost:5432/cabinet_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r versions/cabinet-2026.09.12/Serveur/requirements.txt
      - run: python -m pytest -q versions/cabinet-2026.09.12/Serveur/tests
      - run: python versions/cabinet-2026.09.12/Tests/audit_statique.py
      - run: python versions/cabinet-2026.09.12/Tests/audit_statique.py --recette
      - run: python versions/cabinet-2026.09.12/Tests/inventaire_architecture.py
      - run: python versions/cabinet-2026.09.12/Tests/test_u2_architecture.py
      - name: Construction OOXML et preparation
        shell: pwsh
        run: |
          ./versions/cabinet-2026.09.12/Tests/test_construction.ps1
          ./versions/cabinet-2026.09.12/Tests/test_installation.ps1
          ./versions/cabinet-2026.09.12/Tests/test_lancement_direct.ps1
          ./versions/cabinet-2026.09.12/Tests/test_assistant.ps1
          ./versions/cabinet-2026.09.12/Tests/test_choix_nas.ps1
          ./versions/cabinet-2026.09.12/Tests/test_attente_office.ps1
          ./versions/cabinet-2026.09.12/Tests/test_feuilles_excel.ps1
          ./versions/cabinet-2026.09.12/Tests/test_compilation_office.ps1
          ./versions/cabinet-2026.09.12/Tests/test_u0_installation.ps1
          ./versions/cabinet-2026.09.12/Tests/test_u1_installation.ps1
          ./versions/cabinet-2026.09.12/Tests/test_u2_manifeste.ps1

  installateur-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Lanceur conforme aux objets du commit source
        run: python Installateur/verifier_lanceur.py
      - name: PowerShell Windows 5.1 - controles hors Office
        shell: powershell
        run: |
          ./versions/cabinet-2026.09.12/Tests/test_construction.ps1
          ./versions/cabinet-2026.09.12/Tests/test_installation.ps1
          ./versions/cabinet-2026.09.12/Tests/test_lancement_direct.ps1
          ./versions/cabinet-2026.09.12/Tests/test_assistant.ps1
          ./versions/cabinet-2026.09.12/Tests/test_choix_nas.ps1
          ./versions/cabinet-2026.09.12/Tests/test_attente_office.ps1
          ./versions/cabinet-2026.09.12/Tests/test_feuilles_excel.ps1
          ./versions/cabinet-2026.09.12/Tests/test_compilation_office.ps1
          ./versions/cabinet-2026.09.12/Tests/test_u0_installation.ps1
          ./versions/cabinet-2026.09.12/Tests/test_u1_installation.ps1
          ./versions/cabinet-2026.09.12/Tests/test_u2_manifeste.ps1

      - name: Lanceur CMD autonome, sans Office ni telechargement
        shell: powershell
        run: |
          if (Test-Path ./Installateur/Test-Lanceur.ps1) { ./Installateur/Test-Lanceur.ps1 }
