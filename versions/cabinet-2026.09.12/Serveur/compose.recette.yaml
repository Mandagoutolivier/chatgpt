services:
  recette:
    image: "${CABINET_MAINTENANCE_IMAGE:-cabinet-maintenance:2026.09.16-u2b}"
    entrypoint: [python3, /tests/recovery_smoke.py]
    environment:
      PGHOST: verification-db
      PGUSER: postgres
      PGDATABASE: cabinet_verification
      PYTHONPATH: /opt/cabinet
    volumes:
      - ./tests/recovery_smoke.py:/tests/recovery_smoke.py:ro
      - ./cabinet/schema.sql:/tests/schema.sql:ro
    networks: [verification]
