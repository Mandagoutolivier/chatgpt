; ============================================================
; Configuration du logiciel de cabinet - fichier UTF-8
; Modifiable avec le Bloc-notes. Lignes ; ou # = commentaires.
; ============================================================

[GENERAL]
NomCabinet=Cabinet de cardiologie
Ville=Beaumont-sur-Oise

[MEDECIN]
; Coordonnees utilisees pour l'en-tete des courriers et la feuille de soins
Titre=Docteur
Prenom=Olivier
Nom=MANDAGOUT
Specialite=Maladies cardio-vasculaires
SousTitre=Ancien interne des Hôpitaux de Paris
AdresseLigne1=10, rue de la Libération
AdresseLigne2=95260 Beaumont-sur-Oise
Telephone=01 34 70 21 02
; RPPS et numero AM : a completer pour la feuille de soins
RPPS=
NumeroAM=
; Bloc signature en bas des courriers (| = saut de ligne)
Signature=Docteur Olivier MANDAGOUT

[API]
; Moteur unique OpenAI Responses API, issu de PROD6.
; Cle locale au poste medecin : OPENAI_API_KEY ou %APPDATA%\CabinetCardio\openai.key
; Le masquage des identifiants est dirige par la fiche patient : il ne garantit pas une anonymisation exhaustive.
Fournisseur=openai
ModeleOpenAI=gpt-4.1
MaxTokens=8000
TimeoutReceptionMs=120000
; Le transport unifie ne journalise aucun corps de requete ou de reponse.
Debug=0

[COURRIER]
; Espacement des paragraphes du corps (releve sur les courriers du cabinet)
SaisieRapide=1
Modele=LETTRE TYPE
EspaceAvantPt=12
EspaceApresPt=0
Interligne=1.15

[DERIVEES]
; Types de lettres proposees par la commande "Lettre derivee" (separes par ;)
Types=Échocardiographie transthoracique;Holter ECG;MAPA;Épreuve d'effort;Avis spécialisé

[ECG]
; Envoi de l'identite patient a Resting12Lead par fichier GDT.
; DossierGdt : dossier LOCAL surveille par l'ECG (Interface GDT In),
;   par exemple C:\Mandagout. Vide = fonction desactivee.
; Cote Resting12Lead : Parametres > Parametres Interface >
;   Saisie Auto info Patient = GDT (Connection Systeme Info DMS DEcochee).
DossierGdt=C:\Mandagout
CodeExamen=EKG01

[AGENDA]
; Vue hebdomadaire : plage horaire, pas des creneaux (minutes), jours affiches (lundi=1er)
HeureDebut=08:00
HeureFin=19:00
PasMinutes=15
Jours=5
; Valeurs proposees par defaut a la prise de rendez-vous
DureeDefautMin=15
ActeDefaut=APC

[ECHANGE]
; Frequence de verification des courriers valides (poste secretaire)
ScrutationSecondes=30

[CERFA]
; A renseigner dans le poste.ini local apres verification papier.
CalageValide=0
PraticienPreimprime=0
; Decalage global d'impression en millimetres (macro de calage)
OffsetX_mm=0
OffsetY_mm=0
Imprimante=

[SORTIE]
Dossier=\\DS224\home\sortiedragon

[INTEGRATION]
Version=2026.09.12-service-nas

[PROD6]
BaseCorrespondants=Base\base_travail_correspondants_v1.xlsx
ModeleComplementaire=Modeles\LETTRE TYPE.dot
DossierDictionnaires=Config\DDE
